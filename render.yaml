# Render Blueprint — Medivault API (NestJS backend only)
#
# The Next.js frontend deploys to Vercel; only the API lives here. The
# biometric bridge is deliberately NOT deployed: it needs a USB port to reach
# the MFS100 scanner, which no cloud instance has. It stays on the workstation.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and prompts once for every `sync: false` value below.

services:
  - type: web
    name: medivault-api
    runtime: node
    # FREE TIER. Real limits you will hit:
    #   - 0.1 CPU / 512 MB. The API alone fits (MongoDB is external, in Atlas).
    #   - Spins down after 15 min without traffic, ~1 min to wake. While asleep
    #     the Vercel frontend's getServerSession() returns null, so anyone
    #     returning to the site is bounced to /login and must re-authenticate.
    #   - Ephemeral filesystem: writes outside MongoDB are lost on every deploy.
    #     STORAGE_PROVIDER=gridfs below is what keeps documents safe.
    #   - No persistent disk and no SSH shell.
    #   - Render cannot host free instances in a HIPAA workspace.
    # To upgrade: change this to `starter` and pick Memory-optimized.
    plan: free

    rootDir: .

    # packages/shared and packages/mfs100-sdk must be compiled before the
    # backend, which requires their dist/ output at build time.
    #
    # Why `rm -rf node_modules` then `npm install`, and not `npm ci`:
    #   - Render caches node_modules between builds, and a cached install kept
    #     serving a newer TypeScript that no longer supports the "node"
    #     moduleResolution used by the root tsconfig.json. Removing the
    #     directory guarantees the compiler matches the `typescript` override
    #     below, regardless of what is in the cache.
    #   - `npm ci` refuses to run when package.json and package-lock.json
    #     disagree, and they do: the security overrides pin
    #     @angular-devkit/core -> picomatch 4.0.7 while the lockfile still
    #     records 4.0.4. `npm install` reconciles that silently instead of
    #     aborting the build. Do not "fix" this by deleting the overrides —
    #     they are CVE pins for qs, body-parser, multer, ajv, and picomatch.
    #   - The `typescript` entry in overrides makes 5.9.3 authoritative, so a
    #     plain install cannot float forward to a version that drops node10.
    #   - `--include=dev` forces devDependencies in explicitly. Render's native
    #     Node builder may export NODE_ENV=production for the build step on its
    #     own, and npm silently turns that into "skip devDependencies", which
    #     strips typescript and @nestjs/cli and breaks `nest build`. Passing
    #     --include=dev makes the install correct no matter what the environment
    #     says, instead of depending on NODE_ENV being unset.
    buildCommand: rm -rf node_modules && npm install --include=dev && npm run build:shared && npm run build:sdk && npm run build:backend

    # NODE_ENV=production is set HERE, at runtime, and deliberately NOT in
    # envVars below. Render applies envVars to the build step as well, and
    # npm treats NODE_ENV=production as "omit devDependencies" — which strips
    # out typescript, @nestjs/cli and husky, so `nest build` cannot run and the
    # build dies with "sh: 1: husky: not found". Scoping it to startCommand
    # keeps the full toolchain available while the app still boots in
    # production mode (secure cookies, strict helmet, no dev logging).
    startCommand: NODE_ENV=production node apps/backend/dist/apps/backend/src/main

    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # ─── Fixed values ──────────────────────────────────────────────────────
      # NODE_ENV is intentionally absent - see the note on startCommand above.
      #   - key: NODE_ENV
      #     value: production
      # Documents go to MongoDB GridFS, not the container's disk — the free
      # instance's filesystem is wiped on every deploy.
      - key: STORAGE_PROVIDER
        value: gridfs
      # Joi only accepts the MFS100 SDK values. The bridge itself stays local;
      # this only selects the provider/validation implementation.
      - key: BIOMETRIC_PROVIDER
        value: mfs100

      # ─── Secrets you supply on first deploy ────────────────────────────────
      # None of these use `generateValue: true` on purpose. MFA_ENCRYPTION_KEY
      # and QR_ENCRYPTION_KEY encrypt values stored in MongoDB — a value that
      # changed on each deploy would make every existing record permanently
      # unreadable. A random value regenerated by Render is a data-loss bug.
      - key: DATABASE_URL
        sync: false          # mongodb+srv://... from apps/backend/.env
      - key: JWT_ACCESS_SECRET
        sync: false          # 64+ random hex chars
      - key: JWT_REFRESH_SECRET
        sync: false          # 64+ random hex chars
      - key: COOKIE_SECRET
        sync: false          # 64+ random hex chars
      - key: MFA_ENCRYPTION_KEY
        sync: false          # >= 32 chars (Joi .min(32))
      - key: QR_ENCRYPTION_KEY
        sync: false          # >= 32 chars (Joi .min(32))
      - key: BIOMETRIC_ENCRYPTION_KEY
        sync: false          # >= 32 chars (Joi .min(32))
      - key: STORAGE_SIGNING_SECRET
        sync: false          # 64+ random hex chars

      # ─── Set after the Vercel project exists ───────────────────────────────
      # Both need the final https://<your-app>.vercel.app origin, comma-
      # separated if you have several. Use a temporary valid-looking URL for
      # the first deploy if Render refuses to start with these blank — the
      # frontend will be blocked by CORS until you correct it.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
