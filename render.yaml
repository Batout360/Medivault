# Render Blueprint — Medivault API (NestJS backend only)
#
# The Next.js frontend deploys to Vercel; only the API lives here. The
# biometric bridge is deliberately NOT deployed: it needs a USB port to reach
# the MFS100 scanner, which no cloud instance has. It stays on the workstation.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and prompts once for every `sync: false` value below.

services:
  - type: web
    name: medivault-api
    runtime: node
    # FREE TIER. Real limits you will hit:
    #   - 0.1 CPU / 512 MB. The API alone fits (MongoDB is external, in Atlas).
    #   - Spins down after 15 min without traffic, ~1 min to wake. While asleep
    #     the Vercel frontend's getServerSession() returns null, so anyone
    #     returning to the site is bounced to /login and must re-authenticate.
    #   - Ephemeral filesystem: writes outside MongoDB are lost on every deploy.
    #     STORAGE_PROVIDER=gridfs below is what keeps documents safe.
    #   - No persistent disk and no SSH shell.
    #   - Render cannot host free instances in a HIPAA workspace.
    # To upgrade: change this to `starter` and pick Memory-optimized.
    plan: free

    rootDir: .

    # packages/shared and packages/mfs100-sdk must be compiled before the
    # backend, which requires their dist/ output at build time.
    #
    # `npm ci` is deliberate and must stay first. Render caches node_modules
    # between builds, so a plain `npm install` can keep serving a stale
    # TypeScript from an earlier build even after package.json pins a version.
    # `npm ci` deletes node_modules and installs strictly from package-lock.json,
    # so the compiler version is whatever the lockfile says. It also fails loudly
    # and immediately if package.json and the lockfile ever drift apart, which is
    # better than a confusing type error three steps later.
    #
    # Do not use `npm install` here. It will not reliably clear the cache.
    buildCommand: npm ci && npm run build:shared && npm run build:sdk && npm run build:backend

    # NOT `npm start` — that fans out to every workspace and tries to boot the
    # frontend and biometric bridge too, which crash-loops the free instance.
    # The compiled entry is nested because dist/apps/backend mirrors the
    # apps/backend/src source tree.
    startCommand: node apps/backend/dist/apps/backend/src/main

    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # ─── Fixed values ──────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      # Documents go to MongoDB GridFS, not the container's disk — the free
      # instance's filesystem is wiped on every deploy.
      - key: STORAGE_PROVIDER
        value: gridfs
      # Joi only accepts the MFS100 SDK values. The bridge itself stays local;
      # this only selects the provider/validation implementation.
      - key: BIOMETRIC_PROVIDER
        value: mfs100

      # ─── Secrets you supply on first deploy ────────────────────────────────
      # None of these use `generateValue: true` on purpose. MFA_ENCRYPTION_KEY
      # and QR_ENCRYPTION_KEY encrypt values stored in MongoDB — a value that
      # changed on each deploy would make every existing record permanently
      # unreadable. A random value regenerated by Render is a data-loss bug.
      - key: DATABASE_URL
        sync: false          # mongodb+srv://... from apps/backend/.env
      - key: JWT_ACCESS_SECRET
        sync: false          # 64+ random hex chars
      - key: JWT_REFRESH_SECRET
        sync: false          # 64+ random hex chars
      - key: COOKIE_SECRET
        sync: false          # 64+ random hex chars
      - key: MFA_ENCRYPTION_KEY
        sync: false          # >= 32 chars (Joi .min(32))
      - key: QR_ENCRYPTION_KEY
        sync: false          # >= 32 chars (Joi .min(32))
      - key: BIOMETRIC_ENCRYPTION_KEY
        sync: false          # >= 32 chars (Joi .min(32))
      - key: STORAGE_SIGNING_SECRET
        sync: false          # 64+ random hex chars

      # ─── Set after the Vercel project exists ───────────────────────────────
      # Both need the final https://<your-app>.vercel.app origin, comma-
      # separated if you have several. Use a temporary valid-looking URL for
      # the first deploy if Render refuses to start with these blank — the
      # frontend will be blocked by CORS until you correct it.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
