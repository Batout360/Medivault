# Medivault — Docker Compose (Development)
#
# Services:
#   mongo     — Primary database (MongoDB 7). The backend uses Mongoose, NOT
#               Prisma — see apps/backend/src/database/database.module.ts. The
#               prisma/ directory and schema.prisma are vestigial MySQL artifacts
#               and are intentionally not used here.
#   redis     — Shared store for @nestjs/throttler. The app falls back to
#               in-memory throttling when Redis is absent, which is per-process
#               and therefore not safe once more than one instance is running.
#   backend   — NestJS API server
#   frontend  — Next.js frontend
#
# Document storage defaults to STORAGE_PROVIDER=local for dev so uploaded files
# land on disk where they can be inspected. Production should use
# STORAGE_PROVIDER=gridfs, which keeps documents inside MongoDB.
#
# Usage:
#   docker compose up          # Start all services
#   docker compose up -d       # Start in background
#   docker compose down        # Stop and remove containers
#   docker compose down -v     # Stop + delete volumes (WARNING: destroys data)

# ─── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# ─── Network ───────────────────────────────────────────────────────────────────
networks:
  medivault_net:
    driver: bridge

services:
  # ─── MongoDB 7 ───────────────────────────────────────────────────────────────
  # Runs as a single-node replica set: Mongoose features that require
  # transactions are unavailable on a standalone mongod.
  mongo:
    image: mongo:7
    container_name: medivault_mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: medivault_root
      MONGO_INITDB_ROOT_PASSWORD: medivault_root_password_change_in_prod
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - medivault_net
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medivault_redis
    restart: unless-stopped
    command: redis-server --requirepass medivault_redis_dev_password --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - medivault_net
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', 'medivault_redis_dev_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (NestJS) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: development
    container_name: medivault_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      # Joi in app.module.ts only accepts mongodb:// or mongodb+srv:// URLs.
      DATABASE_URL: mongodb://medivault_root:medivault_root_password_change_in_prod@mongo:27017/medivault?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: medivault_redis_dev_password
      REDIS_DB: 0
      JWT_ACCESS_SECRET: dev_jwt_access_secret_min_32_chars_changeme_now
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_min_32_chars_changeme_now
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: dev_cookie_secret_min_32_chars_changeme
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/uploads
      # Only "mfs100" is accepted by the Joi schema; biometrics are inert on Linux.
      BIOMETRIC_PROVIDER: mfs100
      BIOMETRIC_ENCRYPTION_KEY: dev_biometric_enc_key_min_32_chars_change
      MFA_ENCRYPTION_KEY: dev_mfa_encryption_key_min_32_chars_change_me
      QR_ENCRYPTION_KEY: dev_qr_encryption_key_min_32_chars_change_me
      STORAGE_SIGNING_SECRET: dev_storage_signing_secret_32_chars_change
      FRONTEND_URL: http://localhost:3000
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 600
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:delegated
      - ./apps/backend/prisma:/app/apps/backend/prisma:delegated
      - ./apps/backend/uploads:/app/uploads
    ports:
      - '3001:3001'
    networks:
      - medivault_net
    command: npm run dev

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: development
    container_name: medivault_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      BACKEND_API_URL: http://backend:3001
      NEXT_PUBLIC_BIOMETRIC_MOCK: 'true'
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src:delegated
      - ./apps/frontend/public:/app/apps/frontend/public:delegated
    ports:
      - '3000:3000'
    networks:
      - medivault_net
    command: npm run dev
